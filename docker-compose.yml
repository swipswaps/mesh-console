# Mesh console — Docker Compose (local backend).
# The public site lives on GitHub Pages:
#   https://swipswaps.github.io/mesh-console/
# This file runs the optional local backend (advanced features).
services:
  mesh-console-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mesh-console-backend
    ports:
      # All interfaces (LAN + overlay reachable). Reads are public-safe
      # data; /api/actions stays bearer-gated regardless of bind.
      # On hostile networks, narrow to 127.0.0.1 or the overlay IP.
      - "5180:5180"
    environment:
      - MESH_STATE_DIR=/mesh-state
      - MESH_HOST_CERT=/certs/ssh_host_ed25519_key-cert.pub
      # MESH_CONSOLE_TOKEN unset => /api/actions 401s (fail closed).
      # Set it via env_file (mode 0600, gitignored), never in this file.
    volumes:
      # Read-only host mounts. PUBLIC/operational data only: mesh state
      # logs + the host SSH *certificate* (public key material). Secrets
      # (api.env, private keys) are NEVER mounted here by design.
      - ~/.local/state/mesh-recover:/mesh-state:ro
      - /etc/ssh/ssh_host_ed25519_key-cert.pub:/certs/ssh_host_ed25519_key-cert.pub:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5180/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
