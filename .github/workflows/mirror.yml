name: mirror-registry
# One-way, lossy projection: private mesh-registry -> public file.
# Auth: read-only deploy key (MESH_SSH_KEY secret, SSH). No PAT exists
# for this path by design — nothing to mint in a browser, nothing with
# write scope. The redact filter is the security boundary (assert-first):
# any secret shape fails the workflow, nothing publishes.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch private registry via deploy key
        env:
          MESH_SSH_KEY: ${{ secrets.MESH_SSH_KEY }}
        run: |
          if [ -z "$MESH_SSH_KEY" ]; then
            echo "MESH_SSH_KEY not set; mirror disabled, keeping snapshot"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$MESH_SSH_KEY" > ~/.ssh/mesh_mirror
          chmod 600 ~/.ssh/mesh_mirror
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mesh_mirror -o StrictHostKeyChecking=accept-new"
          rm -rf /tmp/registry && git clone --depth 1 --filter=blob:none --sparse git@github.com:swipswaps/mesh-registry.git /tmp/registry
          git -C /tmp/registry sparse-checkout set --no-cone endpoints.json
          cp /tmp/registry/endpoints.json /tmp/endpoints.json
          rm -rf /tmp/registry ~/.ssh/mesh_mirror
      - name: Redact + assert
        run: |
          test -f /tmp/endpoints.json || { echo "no registry fetch; keeping snapshot"; exit 0; }
          python3 - <<'PY'
          import json, re, sys
          doc = json.load(open("/tmp/endpoints.json"))
          redacted = {"nodes": {}, "updated_utc": doc.get("updated_utc")}
          for name, info in sorted((doc.get("nodes") or {}).items()):
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.-]{0,63}", str(name)):
                  raise SystemExit("bad node name: %r" % name)
              redacted["nodes"][name] = {
                  "lan": info.get("lan_ipv4"),
                  "overlay": None,
                  "updated_utc": info.get("updated_utc"),
              }
              for ip in (info.get("lan_ipv4"), info.get("egress_ipv4")):
                  if ip is not None and not re.fullmatch(r"[0-9.]{7,15}", str(ip)):
                      raise SystemExit("bad ipv4 shape for %s" % name)
          out = json.dumps(redacted, indent=2) + "\n"
          if re.search(r"sk-|apikey_|BEGIN .*PRIVATE|TOKEN=|PASSWORD=", out, re.I):
              raise SystemExit("secret shape in mirror output; refusing to publish")
          open("frontend/public/endpoints.json", "w").write(out)
          print("mirror written")
          PY
      - name: Commit if changed
        id: mirror_commit
        run: |
          git config user.name "mesh-console-mirror"
          git config user.email "mesh-console-mirror@users.noreply.github.com"
          git add frontend/public/endpoints.json
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "mirror endpoints snapshot" && git push || true
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
      # NOTE: pushes made with GITHUB_TOKEN do not trigger other
      # workflows (no cascade), so deploy-pages never fires for mirror
      # commits. Deploy from THIS job when the snapshot changed instead.
      - name: Setup node for deploy
        if: steps.mirror_commit.outputs.committed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build + deploy
        if: steps.mirror_commit.outputs.committed == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Publish to gh-pages
        if: steps.mirror_commit.outputs.committed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
